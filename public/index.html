  <link

    href="https://fonts.gstatic.com"

    href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@300;400&display=swap"

    property="og:title"

    content="https://nexgn.cloud/"
  />

  <meta
    property="twitter:title"

    rel="icon"

    sizes="32x32"
    href="/favicon-32x32.png"

    name="msapplication-TileColor"

    name="theme-color"
    content="#FF0915"

       CONTENT SECURITY POLICY
       ========================================================== -->

      default-src 'self';
      script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://analytics.ahrefs.com;

      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://*;
      connect-src 'self' https://api.nexgn.cloud https://lumberjack.razorpay.com https://analytics.ahrefs.com;
    "
  />

  <link
