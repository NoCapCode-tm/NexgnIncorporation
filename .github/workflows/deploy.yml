name: Deploy Nexgn to GitHub Pages

on:
  push:
    branches: [main]         # Triggers on push to main
  workflow_dispatch:         # Allows manual deployment from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache Rsbuild to drastically speed up future CI/CD pipelines
      - name: Cache Rsbuild
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-rsbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rsbuild-

      - name: Install Dependencies
        run: npm ci

      # This will automatically run your "prebuild" sitemap script first, 
      # then build the Rsbuild bundle, then copy 404.html.
      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4