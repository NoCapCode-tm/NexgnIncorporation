name: Deploy Nexgn to GitHub Pages

on:
  push:
    branches: [main] # Triggers on push to main branch
  workflow_dispatch: # Allows manual deployment from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache Rsbuild to speed up future CI/CD pipelines
      - name: Cache Rsbuild
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-rsbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rsbuild-

      - name: Install Dependencies
        run: npm ci

      # `npm run build` runs, in order:
      #   prebuild  -> scripts/generate-sitemap.mjs   (writes sitemap.xml)
      #   build     -> rsbuild build                  (outputs dist/)
      #   postbuild -> scripts/prerender-shells.mjs   (one real .html file per sitemap URL + 404.html)
      - name: Build Application
        run: npm run build

      # Fail the deploy if the page shells are missing, so a broken build can never ship 404s again
      - name: Verify page shells
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/en/pricing.html
          test -f dist/en/legal/terms.html
          test -f dist/en/sustainability.html
          echo "Page shells OK: $(find dist -name '*.html' | wc -l) HTML files"

      # Custom domain (nexgn.cloud) comes from public/CNAME, which Rsbuild copies into dist/
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://nexgn.cloud
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4