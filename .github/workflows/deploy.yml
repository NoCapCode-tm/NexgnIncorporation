name: Deploy Nexgn to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full Git History for Accurate Sitemap lastmod)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Rsbuild
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-rsbuild-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-rsbuild-

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium for Prerender
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Deps on Cache Hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install System Fonts for Multilingual Dynamic OG Cards (EN / ES / HI)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-liberation

      - name: Build & Prerender Static SEO Shells
        env:
          CI: 'true'
        run: npm run build

      - name: Verify SEO Shells, Zero-Noindex Leak & GEO Files
        run: |
          set -e
          # 1. Critical root & GEO/GitHub Pages files must exist
          for f in dist/index.html dist/404.html dist/CNAME dist/.nojekyll dist/robots.txt dist/sitemap.xml dist/llms.txt dist/llms-full.txt dist/.well-known/security.txt; do
            test -f "$f" || { echo "MISSING REQUIRED FILE: $f"; exit 1; }
          done

          # 2. Key localized shells must exist with real <h1> and NEVER have noindex
          for page in dist/index.html dist/en.html dist/en/pricing.html dist/en/alternatives.html dist/en/alternatives/docusign.html dist/en/alternatives/signnow.html dist/en/legal/terms.html dist/en/sustainability.html dist/es/legal/terms.html; do
            test -f "$page" || { echo "MISSING PAGE SHELL: $page"; exit 1; }
            grep -q "<h1" "$page" || { echo "NO <h1 FOUND IN: $page"; exit 1; }
            if grep -qi 'content="noindex' "$page"; then
              echo "FATAL SEO ERROR: noindex found on indexable page $page"
              exit 1
            fi
          done

          # 3. 404.html MUST be noindex
          grep -qi 'content="noindex' dist/404.html || { echo "404.html missing noindex"; exit 1; }

          # 4. Product & Comparison structured data checks
          grep -q '"@type":"Product"' dist/en/products/ai-summary.html
          grep -q '"@type":"FAQPage"' dist/en/alternatives/docusign.html
          grep -q '"@type":"FAQPage"' dist/en/pricing.html

          # 5. Dynamic OG Images & Meta Tag verification
          for og in dist/og/en/blog.png dist/og/es/blog.png dist/og/hi/blog.png dist/og/en/pricing.png dist/og/en/alternatives/docusign.png; do
            test -f "$og" || { echo "MISSING DYNAMIC OG IMAGE: $og"; exit 1; }
          done
          grep -q 'https://nexgn.cloud/brand/og-image.png' dist/index.html
          grep -q 'https://nexgn.cloud/og/en/blog.png' dist/en/blog.html
          grep -q 'https://nexgn.cloud/og/es/blog.png' dist/es/blog.html

          echo "VERIFIED: $(find dist -name '*.html' | wc -l) HTML pages + $(find dist/og -name '*.png' | wc -l) dynamic OG images built cleanly."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://nexgn.cloud
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout (for IndexNow script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Live Endpoints & Submit IndexNow
        continue-on-error: true
        run: |
          sleep 45
          curl -sSfI https://nexgn.cloud/en/alternatives | head -n 5
          curl -sSfI https://nexgn.cloud/llms.txt | head -n 5
          curl -sSfI https://nexgn.cloud/sitemap.xml | head -n 5
          node scripts/generate-sitemap.mjs
          node scripts/indexnow.mjs